</script><script>'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const epworth=[
'Sentado(a) enquanto lê','Assistindo à televisão','Sentado(a), sem atividade, em um lugar público (por exemplo, uma sala de espera)','Como passageiro(a) em um carro durante uma hora, sem parada','Deitado(a) para descansar à tarde, quando possível','Sentado(a) conversando com alguém','Sentado(a) tranquilamente após o almoço, sem beber álcool','Em um carro, parado(a) por alguns minutos no trânsito'];
const stop=[
['snore','Você ronca alto (mais alto que uma conversa ou ouvido através de uma porta fechada)?'],
['tired','Você frequentemente sente cansaço, fadiga ou sonolência durante o dia?'],
['observed','Alguém já percebeu que você para de respirar enquanto dorme?'],
['pressure','Você tem pressão alta ou faz tratamento para hipertensão?']];
const questions=[
{key:'motivo',title:'O que fez você querer avaliar seu sono?',multi:true,options:['Eu ronco','Acordo cansado(a)','Sinto sono durante o dia','Quero cuidar melhor da minha saúde','Alguém percebe pausas na minha respiração','Apenas curiosidade','Outro motivo']},
{key:'sintomas',title:'Quais destes sinais você percebe?',multi:true,options:['Ronco frequente','Pausas na respiração','Cansaço ao acordar','Sonolência durante o dia','Boca seca ao acordar','Dor de cabeça pela manhã','Nenhum destes']},
{key:'exame',title:'Você já fez algum exame do sono?',options:['Não','Sim, resultado normal','Sim, fui informado(a) de apneia','Sim, mas não lembro o resultado']},
...epworth.map((title,i)=>({key:'e'+i,title:'Qual é sua chance de cochilar nesta situação?',subtitle:title,options:['0 — Nenhuma chance','1 — Pequena chance','2 — Chance moderada','3 — Grande chance'],epworth:true})),
...stop.map(([key,title])=>({key,title,options:['Sim','Não','Não sei']})),
{key:'birth',title:'Qual é sua data de nascimento?',input:'date'},
{key:'weight',title:'Qual é seu peso aproximado em kg?',input:'number',placeholder:'Ex.: 78',min:20,max:400},
{key:'height',title:'Qual é sua altura em centímetros?',input:'number',placeholder:'Ex.: 170',min:100,max:230},
{key:'neck',title:'A circunferência do seu pescoço é maior que 40 centímetros?',options:['Sim','Não','Não sei']},
{key:'sex',title:'Qual sexo foi registrado ao nascimento?',subtitle:'Esta informação é usada apenas para a pontuação original do STOP-BANG.',options:['Masculino','Feminino','Prefiro não informar']},
{key:'impact',title:'Quanto seu sono afeta sua qualidade de vida?',options:['Nada','Um pouco','Moderadamente','Muito']}
];
let step=-1, data={}, sent=false, sending=false, request=false, saved=false, uid=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'aaaaaaaa-aaaa-4aaa-8aaa-'+Math.random().toString(16).slice(2).padEnd(12,'0');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(step===-1)return intro();if(step===-2)return result();if(step===-3)return contact();if(step===-4)return thanks();const q=questions[step];const pct=Math.round(step/questions.length*100);app.innerHTML=`<div class="progress"><div style="width:${pct}%"></div></div><div class="step">Pergunta ${step+1} de ${questions.length}</div><h2>${esc(q.title)}</h2>${q.subtitle?`<p>${esc(q.subtitle)}</p>`:''}${q.help?`<p class="muted">${esc(q.help)}</p>`:''}${q.multi?'<p class="muted">Você pode marcar mais de uma alternativa.</p>':''}<form id="qform">${q.input?`<div class="field"><input id="answer" type="${q.input}" ${q.input==='number'?`min="${q.min}" max="${q.max}" step="any"`:''} value="${esc(data[q.key]||'')}" placeholder="${esc(q.placeholder||'')}" ${q.optional?'':'required'}></div>`:`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${q.multi?'checkbox':'radio'}" name="answer" value="${esc(o)}" ${q.multi?(data[q.key]||[]).includes(o)?'checked':'':data[q.key]===o?'checked':''}>${esc(o)}</label>`).join('')}</div>`}<div class="actions"><button class="secondary" type="button" id="back">Voltar</button><button class="primary" type="submit">${step===questions.length-1?'Ver resultado':'Continuar →'}</button></div><p id="err" class="error"></p></form>`;$('#back').onclick=()=>{step--;render()};const advanceQuestion=e=>{if(e)e.preventDefault();let v;if(q.input){v=$('#answer').value.trim();if(!v&&!q.optional)return; if(q.input==='date' && (new Date(v+'T12:00:00')>new Date() || new Date(v+'T12:00:00').getFullYear()<1900)){ $('#err').textContent='Confira sua data de nascimento.';return;} if(q.input==='number'&&v&&(Number(v)<q.min||Number(v)>q.max)){ $('#err').textContent='Confira o valor informado.';return;}}else if(q.multi){v=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(!v.length){$('#err').textContent='Escolha pelo menos uma opção.';return;}if(v.includes('Nenhum destes')&&v.length>1){$('#err').textContent='Selecione “Nenhum destes” sozinho ou escolha os sintomas.';return;}}else{v=document.querySelector('input[name="answer"]:checked')?.value;if(!v){$('#err').textContent='Escolha uma opção.';return;}}data[q.key]=v;step++;if(step>=questions.length)step=-2;render()};$('#qform').addEventListener('submit',advanceQuestion);}
function intro(){app.innerHTML=`<h1>Você dorme bem de verdade?</h1><p>Responda a algumas perguntas e veja se seu sono merece atenção.</p><p class="muted">Gratuito · Resultado imediato · Aproximadamente 5 minutos</p><form id="intro"><div class="field"><label for="name">Seu nome</label><input id="name" autocomplete="name" required value="${esc(data.name||'')}"></div><div class="field"><label for="phone">Telefone com DDD (para ligação)</label><input id="phone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="(37) 99999-9999" value="${esc(data.phone||'')}"></div><div class="field"><label for="email">E-mail (opcional)</label><input id="email" type="email" autocomplete="email" value="${esc(data.email||'')}"></div><label class="check"><input type="checkbox" id="privacy" ${data.privacy?'checked':''} required>Li as informações sobre o tratamento dos meus dados de saúde para esta avaliação. ${window.VITONI_CONFIG.privacyUrl?`<a href="${esc(window.VITONI_CONFIG.privacyUrl)}" target="_blank" rel="noopener">Aviso de privacidade</a>`:'O aviso de privacidade deve ser disponibilizado antes da publicação.'}</label><p class="note">O questionário não faz diagnóstico. No final, você poderá escolher se deseja que a equipe entre em contato.</p><button class="primary" type="submit">Começar avaliação →</button><p class="error" id="err"></p></form>`;$('#intro').onsubmit=e=>{e.preventDefault();const phone=$('#phone').value.replace(/\D/g,'');if(phone.length<10||phone.length>11){$('#err').textContent='Informe um telefone com DDD válido.';return}data={...data,name:$('#name').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),privacy:$('#privacy').checked};step=0;render()};}
function scores(){let ep=epworth.reduce((sum,_,i)=>sum+Number((data['e'+i]||'0').charAt(0)),0);let vals=stop.map(([k])=>data[k]==='Sim'?1:data[k]==='Não'?0:null);const dob=data.birth?new Date(data.birth+'T12:00:00'):null;const today=new Date();const age=dob?(today.getFullYear()-dob.getFullYear()-(today.getMonth()<dob.getMonth()||(today.getMonth()===dob.getMonth()&&today.getDate()<dob.getDate())?1:0)):null;vals.push(data.weight&&data.height?(Number(data.weight)/((Number(data.height)/100)**2)>35?1:0):null);vals.push(age===null?null:age>50?1:0);vals.push(data.neck==='Sim'?1:data.neck==='Não'?0:null);vals.push(data.sex==='Masculino'?1:data.sex==='Feminino'?0:null);const total=vals.reduce((a,b)=>a+(b||0),0), missing=vals.filter(v=>v===null).length;const stopFour=vals.slice(0,4).reduce((a,b)=>a+(b||0),0);const high=total>=5||(stopFour>=2&&(vals[4]===1||vals[6]===1||vals[7]===1));return {ep,stop:total,missing,epLabel:ep>=11?'Sonolência diurna aumentada':'Sem sonolência excessiva pela pontuação',stopLabel:missing?'Pontuação incompleta':high?'Alto risco':total<=2?'Baixo risco':'Risco intermediário'};}
function result(){const s=scores();if(!saved && window.VITONI_CONFIG.apiUrl){saved=true;submit(false).catch(()=>{saved=false;});}app.innerHTML=`<div class="progress"><div style="width:100%"></div></div><h1>Sua avaliação do sono está pronta!</h1><p>Veja o que suas respostas mostram.</p><div class="result"><span class="pill">Sonolência durante o dia</span><h2>${s.ep} de 24 pontos</h2><b>${esc(s.epLabel)}</b></div><div class="result"><span class="pill">Risco de apneia do sono</span><h2>${s.stop} de 8 pontos${s.missing?' (mínimo conhecido)':''}</h2><b>${esc(s.stopLabel)}</b>${s.missing?'<p>Algumas medidas não foram informadas. Não é possível classificar o risco com segurança.</p>':''}</div><p class="note">Este é um rastreamento, não um diagnóstico. Mesmo com pontuação baixa, sintomas persistentes merecem avaliação. Se você sente sono ao dirigir, evite dirigir com sonolência e procure orientação profissional.</p><h2>Você tem interesse em investigar melhor seu sono?</h2><p>Se escolher “Sim”, você solicita que nossa equipe entre em contato por ligação telefônica no número informado.</p><button class="primary" id="contact">Sim, quero investigar melhor</button><button class="secondary" id="finish">Não, obrigado(a)</button><p class="muted" id="status">${window.VITONI_CONFIG.apiUrl?'O envio será solicitado; aguarde confirmação da clínica.':'Versão de demonstração: os dados ainda não são enviados ao Google Drive.'}</p>`;$('#contact').onclick=async()=>{if(sending)return;request=true;await submit(true)};$('#finish').onclick=()=>{request=false;step=-4;render()};}
function contact(){app.innerHTML=`<h1>Vamos conversar?</h1><p>Ao confirmar, você solicita que nossa equipe ligue para o número <strong>${esc(data.phone)}</strong> para falar sobre sua avaliação.</p><p class="note">A ligação é opcional. Não é necessário solicitar contato para ver seu resultado.</p><button class="primary" id="confirm">Confirmar solicitação de ligação</button><button class="secondary" id="back">Voltar ao resultado</button><p class="error" id="err"></p>`;$('#back').onclick=()=>{step=-2;render()};$('#confirm').onclick=async()=>{if(sending)return;request=true;await submit(true);};}
async function submit(isCall){
 if(!window.VITONI_CONFIG.apiUrl){if(isCall){step=-4;render();}return;}
 sending=true;const btn=$('#contact');if(btn)btn.disabled=true;
 try{
  const sc=scores();const payload={...data,...sc,id:uid,epworthAnswers:epworth.map((_,i)=>Number(data['e'+i].charAt(0))),answers:Object.fromEntries(Object.entries(data).filter(([k])=>!['name','phone','email'].includes(k))),requestedCall:!!isCall,source:new URLSearchParams(location.search).get('origem')||'site',submittedAt:new Date().toISOString()};
  // Apps Script redirects cross-origin requests; no-cors makes the response opaque.
  // Therefore this client cannot claim that the server confirmed receipt.
  await fetch(window.VITONI_CONFIG.apiUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(isCall){step=-4;render();}
 }catch(e){if(isCall){$('#err').textContent='Não foi possível enviar. Ligue para '+window.VITONI_CONFIG.clinicPhone;}else saved=false;}
 finally{sending=false;const b=$('#contact');if(b)b.disabled=false;}
}
function thanks(){app.innerHTML=`<div class="success">✓</div><h1>${request?'Interesse registrado nesta demonstração':'Avaliação concluída'}</h1><p>${request?'Nesta versão de teste, sua solicitação não foi enviada à clínica. A ligação será habilitada quando a integração estiver configurada.':'Obrigado por responder. Você pode encerrar esta página.'}</p><p>Obrigado por confiar na Clínica Vitoni!</p><button class="secondary" id="again">Ver meus resultados</button>`;$('#again').onclick=()=>{step=-2;render()};}
render();
</script></body></html>
